<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="40%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f74c00"/>
      <stop offset="50%" stop-color="#ff7b39"/>
      <stop offset="100%" stop-color="#fba158"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2438" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e1524" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#253248" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-25px) scale(1.15); opacity: 0.55; }
    }
    @keyframes scanline {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite 2s; }
    .float-1 { animation: floatCard1 6s ease-in-out infinite; }
    .float-2 { animation: floatCard2 7s ease-in-out infinite 1s; }
    .cursor { animation: blinkCursor 1s infinite; }
    .scan-beam { animation: scanline 7s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="200" cy="90" r="140" fill="#f74c00" opacity="0.35" filter="url(#glow)"/>
  <circle class="orb-2" cx="1020" cy="240" r="160" fill="#00f2fe" opacity="0.25" filter="url(#glow)"/>

  <!-- Scanning Light Ray -->
  <g opacity="0.15">
    <line class="scan-beam" x1="0" y1="0" x2="300" y2="360" stroke="#00f2fe" stroke-width="2" />
  </g>

  <!-- Foreground Dynamic Elements: Terminal Preview Cards (Side Flanks, Keeping Center Clear) -->
  <!-- Left Side Interactive Pill Card -->
  <g class="float-1" transform="translate(45, 65)">
    <rect width="210" height="85" rx="12" fill="url(#cardGrad)" stroke="#f74c00" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="20" cy="22" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="22" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="22" r="5" fill="#27c93f"/>
    <text x="20" y="52" fill="#ff9d66" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">$ cargo build --release</text>
    <text x="20" y="70" fill="#4ade80" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">✓ Optimized [0.42s]</text>
  </g>

  <g class="float-2" transform="translate(55, 205)">
    <rect width="200" height="80" rx="12" fill="url(#cardGrad)" stroke="#4facfe" stroke-width="1.2" stroke-opacity="0.5"/>
    <text x="18" y="32" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">SHELL CORE</text>
    <text x="18" y="55" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="bold">nu | ion | starship</text>
  </g>

  <!-- Right Side Interactive Stats Card -->
  <g class="float-2" transform="translate(945, 65)">
    <rect width="210" height="85" rx="12" fill="url(#cardGrad)" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="20" cy="22" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="22" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="22" r="5" fill="#27c93f"/>
    <text x="20" y="52" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">$ rg "pattern" --stats</text>
    <text x="20" y="70" fill="#a7f3d0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">⚡ 10x GNU coreutils</text>
  </g>

  <g class="float-1" transform="translate(945, 205)">
    <rect width="210" height="80" rx="12" fill="url(#cardGrad)" stroke="#f74c00" stroke-width="1.2" stroke-opacity="0.5"/>
    <text x="18" y="32" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">GPU TERMINAL ECOSYSTEM</text>
    <text x="18" y="55" fill="#ff7b39" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="bold">warp | wezterm | rio</text>
  </g>

  <!-- Main Center Header (Clear Foreground, Not Obscured) -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Sub-badge -->
    <rect x="-190" y="-45" width="380" height="28" rx="14" fill="#1e293b" stroke="#f74c00" stroke-width="1" opacity="0.9"/>
    <text x="0" y="-26" fill="#fb923c" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">🦀 NEXT-GEN RUST COMMAND LINE STACK ⚡</text>

    <!-- Main Title -->
    <text x="0" y="42" fill="url(#rustGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">Awesome Rust Shells &amp; CLI</text>

    <!-- Command Prompt Simulation in Subtitle -->
    <g transform="translate(0, 85)">
      <text fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" font-weight="500">
        <tspan fill="#38bdf8">❯ </tspan>
        <tspan fill="#f1f5f9">Modern Shells, Blazing Coreutils &amp; GPU Terminals </tspan>
        <tspan class="cursor" fill="#f74c00" font-weight="bold">_</tspan>
      </text>
    </g>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 140)">
      <!-- Pill 1 -->
      <rect x="-250" y="-12" width="95" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="-202" y="4" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ High Speed</text>

      <!-- Pill 2 -->
      <rect x="-140" y="-12" width="105" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="-87" y="4" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔒 Memory Safe</text>

      <!-- Pill 3 -->
      <rect x="-20" y="-12" width="115" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="37" y="4" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">📊 Structured Data</text>

      <!-- Pill 4 -->
      <rect x="110" y="-12" width="140" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="180" y="4" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🎮 GPU Acceleration</text>
    </g>
  </g>
</svg>
